name: release

# main 에 새 버전이 들어오면(릴리즈 PR 을 머지하면) 그 버전의 태그와 GitHub 릴리즈를 만든다.
# - 버전: 루트 package.json 의 version
# - 제목: 버전만 (예: v0.0.2). 요약 문구를 붙이지 않는다
# - 본문: docs/releases/<버전>.md 에서 첫 줄(`# v버전` 제목 줄)을 뺀 나머지
# 그 버전의 릴리즈가 이미 있으면 아무것도 하지 않는다 (버전을 올리지 않은 커밋에서는 매번 여기서 끝난다).
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 태그와 릴리즈 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 외부 액션에 기대지 않고 이 커밋만 직접 받아 온다
          git init -q repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD

          version="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json 의 version 이 x.y.z 형식이 아닙니다: ${version}"
            exit 1
          fi
          tag="v${version}"

          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "릴리즈 ${tag} 가 이미 있습니다. 할 일이 없습니다."
            exit 0
          fi

          notes="docs/releases/${version}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::${notes} 가 없습니다. 릴리즈 본문 파일을 추가하세요."
            exit 1
          fi
          # 첫 줄은 파일의 제목 줄(# v버전)이다. 릴리즈 제목은 버전만 쓰므로 본문에서는 뺀다
          tail -n +2 "$notes" > "${RUNNER_TEMP}/body.md"

          gh release create "$tag" --repo "$REPO" --target "$SHA" --title "$tag" --notes-file "${RUNNER_TEMP}/body.md"
          echo "릴리즈 ${tag} 를 만들었습니다."
